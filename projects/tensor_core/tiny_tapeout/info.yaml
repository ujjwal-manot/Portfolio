# Tiny Tapeout IHP shuttle project metadata for the 4x4 EdgeSense-130 tensor core tile.
project:
  title: "EdgeSense-130 4x4 Mixed-Precision Tensor Core"
  author: "EdgeSense-130"
  discord: ""
  description: "4x4 systolic array supporting BF16, FP8 (E4M3/E5M2), and OCP MXFP8/MXFP4 with FP32 accumulation."
  language: "SystemVerilog"
  clock_hz: 50000000
  tiles: "2x2"
  top_module: "tt_um_edgesense_tensor"
  source_files:
    - "../design/fma.sv"
    - "../design/tensor_core.sv"
    - "tt_um_edgesense_tensor.sv"
