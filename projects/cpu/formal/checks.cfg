# riscv-formal setup for the cpu: every RV32I instruction against the spec, register, pc, uniqueness, causality and liveness checks, with aligned memory (a misaligned access traps) and the yices solver in the tool image.
[options]
isa rv32i
solver yices

[depth]
insn            16
reg       10    20
pc_fwd    10    20
pc_bwd    10    20
unique    1  10 20
causal    10    20
liveness  1  10 30
ill             16
cover     1     20

[defines]
`define RISCV_FORMAL_ALIGNED_MEM

[verilog-files]
@basedir@/../../formal/wrapper.sv
@basedir@/../../design/cpu.sv
@basedir@/../../../fifo_bridge/design/reset_sync.sv

[cover]
always @* if (!reset) cover (channel[0].cnt_insns == 4);
always @* if (!reset) cover (rvfi_valid && rvfi_intr);
